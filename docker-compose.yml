services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BROWSER: "on"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/bitnami/minio/data

  httpbin:
    image: mccutchen/go-httpbin:2.26.0
    ports:
      - "127.0.0.1:${HTTPBIN_PORT:-8080}:8080"

  api:
    build: .
    environment:
      # Containers reach the services by name, not through the host ports.
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-fashion-mnist}
      MINIO_ENDPOINT: minio:9000
      MINIO_SECURE: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  ui:
    build: .
    command:
      - streamlit
      - run
      - src/fashion_mnist_mlops/ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.maxUploadSize=5
      - --browser.gatherUsageStats=false
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:${STREAMLIT_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mlflow_data:
  minio_data:
